services:
  frontend:
    build:
      context: ./frontend
      platforms: [linux/amd64]          # EC2 t2.small is x86 (matters on Apple Silicon Macs)
    image: ${DOCKERHUB_USER}/restaurant-frontend:1.0
    container_name: frontend
    ports:
      - "80:80"                         # browser / ALB -> port 80 -> Nginx
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      platforms: [linux/amd64]
    image: ${DOCKERHUB_USER}/restaurant-backend:1.0
    container_name: backend
    env_file:
      - ./backend/.env                  # SUPABASE_URL, SUPABASE_KEY (never commit this)
    expose:
      - "5000"                          # only reachable inside the Compose network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data           # named volume = persistent data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

volumes:
  pgdata:
