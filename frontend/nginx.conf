server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API requests to the backend container (service name "backend")
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Same-origin through this proxy, so drop the browser Origin header
        # (otherwise the backend's CORS list would reject the ALB hostname)
        proxy_set_header Origin "";
    }

    # React Router: send unknown paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
